<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Face Tracking Test</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: monospace;
      overflow: hidden;
    }

    #face-camera {
      position: fixed;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      transform: scaleX(-1);

      background: black;
    }

    #tracking-info {
      position: fixed;

      top: 15px;
      left: 15px;

      z-index: 10;

      padding: 15px;

      background: rgba(0, 0, 0, 0.8);

      border-radius: 10px;

      font-size: 16px;

      white-space: pre-line;
    }
  </style>
</head>

<body>

  <video
    id="face-camera"
    autoplay
    playsinline
    muted
  ></video>

  <div id="tracking-info">
    STARTING...
  </div>

  <script
    type="module"
    src="/lib/test/face-test.ts"
  ></script>

</body>
</html>
