<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inochi Face Tracking</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: sans-serif;
    }
    #face-camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      background: #000;
      display: none;
    }
    #home {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
    }
    #home h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }
    #home p {
      margin: 0 0 30px;
      opacity: 0.75;
      line-height: 1.6;
    }
    #start-button {
      border: 0;
      padding: 16px 35px;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    #tracking-info {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      font-family: monospace;
      font-size: 15px;
      white-space: pre-line;
      display: none;
    }
  </style>
</head>
<body>
  <div id="home">
    <h1>Inochi Face Tracking</h1>
<p>
  iPhoneのカメラを使って<br>
  顔の動きをテストします
</p>
<button id="start-button">
  カメラを起動
</button>
  </div>

<video
id=“face-camera”
autoplay
playsinline
muted

</video>
  <div id="tracking-info">
    STARTING...
  </div>
  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";
    window.mediapipeTest = {
      FaceLandmarker,
      FilesetResolver
    };
    console.log("MEDIAPIPE CDN OK");
  </script>
  <script
    type="module"
    src="/lib/test/face-test.ts"
  ></script>
</body>
</html>
