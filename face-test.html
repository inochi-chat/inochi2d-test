<!doctype html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inochi Face Tracking</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: sans-serif;
    }
    #home {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 5;
    }
    #start-button {
      padding: 16px 32px;
      border: 0;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
    }
    #face-camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: none;
    }
    #tracking-info {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      padding: 12px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      font-family: monospace;
      white-space: pre-line;
      display: none;
    }
  </style>
</head>
<body>
    <div id="home">
    <h1>Inochi Face Tracking</h1>
    <p>iPhoneのカメラで顔の動きをテストします</p>
    <button id="start-button">カメラを起動</button>
  </div>

  <video
    id="face-camera"
    autoplay
    playsinline
    muted
  ></video>

  <div id="tracking-info">STARTING...</div>
  <script type="module" src="/lib/test/face-test.ts"></script>
</body>
</html>
